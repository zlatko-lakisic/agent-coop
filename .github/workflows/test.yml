name: Test

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.decide.outputs.code }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags origin "$BASE_REF" || true
          if ! git diff --name-only "origin/${BASE_REF}...HEAD" > /tmp/changed.txt; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! python scripts/ci_changes.py < /tmp/changed.txt > /tmp/code.txt; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cat /tmp/code.txt >> "$GITHUB_OUTPUT"

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Check the support page
        run: python scripts/gen_agents_support.py --check

  docs-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Repo checks
        env:
          PYTHONPATH: src:tests
        run: python -m unittest tests.test_repo -v
      - name: Check the support page
        run: python scripts/gen_agents_support.py --check
      - name: Check relative links
        run: python scripts/check_links.py
      - name: Compatibility table
        run: |
          python3 scripts/gen_compat.py --check
          python3 scripts/check_compat.py --code
      - name: Compatibility note
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          git diff --name-only "origin/${BASE_REF}" HEAD | python3 scripts/check_compat.py
      - name: Wiki note
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          git diff --name-only "origin/${BASE_REF}" HEAD | python3 scripts/check_wiki_note.py

  viewer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Detect viewer changes
        id: viewer
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags origin "${{ github.base_ref }}" || true
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -E '^(web/|src/agentcoop/data/viewer/)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install, test, build, and check committed output
        if: steps.viewer.outputs.run == 'true'
        working-directory: web
        run: |
          npm ci
          npm test
          npm run build
          git diff --exit-code -- ../src/agentcoop/data/viewer
          python3 - <<'PY'
          import gzip, pathlib
          root = pathlib.Path("../src/agentcoop/data/viewer")
          js = sum(len(gzip.compress(p.read_bytes())) for p in root.rglob("*.js"))
          css = sum(len(gzip.compress(p.read_bytes())) for p in root.rglob("*.css"))
          imgs = sum(p.stat().st_size for p in root.rglob("*") if p.suffix.lower() in {".png", ".webp", ".svg", ".jpg"})
          assert js <= 150_000, js
          assert css <= 30_000, css
          assert imgs <= 600_000, imgs
          print(f"ok js={js} css={css} imgs={imgs}")
          PY

  upgrade-matrix:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Upgrade every published release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AGENTCOOP_GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/upgrade_matrix.py

  result:
    name: Test result
    if: always()
    needs: [changes, test, docs-check, upgrade-matrix, viewer]
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate
        env:
          CHANGES: ${{ needs.changes.result }}
          TEST: ${{ needs.test.result }}
          DOCS: ${{ needs.docs-check.result }}
          MATRIX: ${{ needs.upgrade-matrix.result }}
          VIEWER: ${{ needs.viewer.result }}
        run: |
          echo "changes=$CHANGES test=$TEST docs-check=$DOCS upgrade-matrix=$MATRIX viewer=$VIEWER"
          for status in "$CHANGES" "$TEST" "$DOCS" "$MATRIX" "$VIEWER"; do
            if [ "$status" = failure ] || [ "$status" = cancelled ]; then
              exit 1
            fi
          done

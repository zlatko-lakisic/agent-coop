name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  tests:
    uses: ./.github/workflows/test.yml

  zipapp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Build zipapp
        run: python3 scripts/build_pyz.py
      - name: Smoke test
        run: python3 scripts/smoke_test.py python3 dist/agentcoop.pyz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agentcoop-pyz
          path: dist/agentcoop.pyz

  binary:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: agentcoop-macos-arm64
          - os: macos-15-intel
            artifact: agentcoop-macos-x86_64
          - os: windows-latest
            artifact: agentcoop-windows-x64
          - os: ubuntu-latest
            artifact: agentcoop-linux-x64
          - os: ubuntu-24.04-arm
            artifact: agentcoop-linux-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install PyInstaller
        run: python -m pip install -r requirements-release.txt
      # TODO: macOS code signing and notarization are not set up.
      # Until then, document the Gatekeeper workaround in docs/troubleshooting.md.
      - name: Build binary
        shell: bash
        run: |
          mkdir -p dist/out
          if [ "$RUNNER_OS" = "Windows" ]; then
            python -m PyInstaller --onefile --name agentcoop --paths src \
              --add-data "src/agentcoop/templates;templates" \
              --add-data "src/agentcoop/gitshim.py;agentcoop" \
              src/agentcoop/__main__.py
            mv dist/agentcoop.exe "dist/out/${{ matrix.artifact }}.exe"
          else
            python -m PyInstaller --onefile --name agentcoop --paths src \
              --add-data "src/agentcoop/templates:templates" \
              --add-data "src/agentcoop/gitshim.py:agentcoop" \
              src/agentcoop/__main__.py
            mv dist/agentcoop "dist/out/${{ matrix.artifact }}"
            chmod +x "dist/out/${{ matrix.artifact }}"
          fi
      - name: Smoke test
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            BIN="dist/out/${{ matrix.artifact }}.exe"
          else
            BIN="dist/out/${{ matrix.artifact }}"
          fi
          python3 scripts/smoke_test.py "$BIN"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact }}
          path: dist/out/*

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [tests, zipapp, binary]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: release
          merge-multiple: true
      - name: Checksums
        run: |
          cd release
          if command -v sha256sum >/dev/null; then
            sha256sum * > SHA256SUMS
          else
            shasum -a 256 * > SHA256SUMS
          fi
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*
      - name: Publish
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: release/*
